# Blueprint de deploy no Render (https://render.com)
# Suba o repositório no GitHub e use "New > Blueprint" apontando para este arquivo.
services:
  - type: web
    name: dk-eletromoveis
    runtime: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: ADMIN_PASSWORD
        sync: false # defina no painel do Render (não versionar a senha)
      - key: ADMIN_SECRET
        generateValue: true # o Render gera um segredo aleatório
      - key: NODE_ENV
        value: production
    healthCheckPath: /

    # -------------------------------------------------------------------
    # PERSISTÊNCIA (para adicionar/remover produtos e manter as imagens):
    # requer INSTÂNCIA PAGA (o plano `free` não permite disco). Para ativar:
    #   1. troque `plan: free` acima por `plan: starter`;
    #   2. descomente o env DATA_DIR e o bloco `disk` abaixo (mesmo mountPath).
    # Assim o app grava em /data/content e /data/uploads, que ficam no disco.
    #
    #   - key: DATA_DIR
    #     value: /data
    #
    # disk:
    #   name: dk-data
    #   mountPath: /data
    #   sizeGB: 1
